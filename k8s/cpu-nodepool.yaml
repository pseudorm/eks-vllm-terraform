
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: "cpu-burstable-graviton-ec2"
spec:
  template:
    metadata:
      labels:
        internal: "true"
        compute: "cpu"
        processor: "graviton"
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - "t4g.small"
            - "t4g.medium"
            - "t4g.large"
            - "t4g.xlarge"
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: 
            - "spot"
            - "on-demand"
      nodeClassRef:
        name: "cpu-burstable-graviton-ec2"
        group: karpenter.k8s.aws
        kind: EC2NodeClass
      expireAfter: 720h
  limits:
    cpu: "10"
    memory: "64Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: "1m"

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: "cpu-burstable-graviton-ec2"
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - id: ami-045aefcf04d3758f6
  role: "karpenter-eks-node-group-20260303082358806200000004"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-ape1
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-ape1
  tags:
    nvidia.com/gpu: "false"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: "30Gi"
        volumeType: gp3
        deleteOnTermination: true
    - deviceName: /dev/xvdb
      ebs:
        volumeSize: "100Gi"
        volumeType: gp3
        deleteOnTermination: true
