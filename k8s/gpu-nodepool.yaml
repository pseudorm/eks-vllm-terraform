
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: "gpu-a10g-ec2"
spec:
  template:
    metadata:
      labels:
        internal: "true"
        compute: "gpu"
        accelerator: a10g
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - "g5.2xlarge"
            - "g5.12xlarge"
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: 
            - "spot"
            - "on-demand"
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
        # prevent Ray head from being scheduled on GPU nodes
        - key: ray.io/node-type
          value: "worker"
          effect: NoSchedule
      nodeClassRef:
        name: "gpu-a10g-ec2"
        group: karpenter.k8s.aws
        kind: EC2NodeClass
      expireAfter: 720h
  limits:
    cpu: "80"
    memory: "320Gi"
    nvidia.com/gpu: "10"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: "15m"

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: "gpu-a10g-ec2"
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - id: ami-0033dd75f1e9f764d
  role: "karpenter-eks-node-group-20260303082358806200000004"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-ape1
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-ape1
  tags:
    nvidia.com/gpu: "true"