apiVersion: ray.io/v1
kind: RayService
metadata:
  name: ray-serve-llm
spec:
  serveConfigV2: |
    applications:
    - name: llms
      import_path: ray.serve.llm:build_openai_app
      route_prefix: "/"
      args:
        llm_configs:
        - model_loading_config:
            model_id: qwen2.5-7b-instruct
            model_source: Qwen/Qwen2.5-7B-Instruct
          engine_kwargs:
            trust_remote_code: true
            dtype: bfloat16
            device: "auto"
            enable_chunked_prefill: true
            max_model_len: 8192
            reasoning_parser: "qwen3"
            language_model_only: true
            gpu_memory_utilization: 0.95
            default-chat-template-kwargs: '{"enable_thinking": false}'
          deployment_config:
            autoscaling_config:
              min_replicas: 0
              max_replicas: 4
              target_ongoing_requests: 64
            max_ongoing_requests: 128      
  rayClusterConfig:
    rayVersion: "2.52.0"
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        num-gpus: "0"
      template:
        spec:
          nodeSelector:
            karpenter.sh/nodepool: cpu-burstable-graviton-ec2
          containers:
          - name: ray-head
            image: rayproject/ray-llm:2.52.0-py311-cu128
            ports:
            - containerPort: 8000
              name: serve
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 6379
              name: gcs
              protocol: TCP
            - containerPort: 8265
              name: dashboard
              protocol: TCP
            - containerPort: 10001
              name: client
              protocol: TCP
            resources:
              limits:
                cpu: "2"
                memory: "5Gi"
              requests:
                cpu: "2"
                memory: "4Gi"
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 0
      maxReplicas: 1
      numOfHosts: 1
      groupName: gpu-group
      rayStartParams:
        num-gpus: "4"
      template:
        metadata:
          annotations:
        spec:
          nodeSelector:
             karpenter.sh/nodepool: gpu-a10g-ec2
          tolerations:
            - key: "nvidia.com/gpu"
              value: "true"
              effect: "NoSchedule"
          containers:
          - name: ray-worker
            image: rayproject/ray-llm:2.52.0-py311-cu128
            resources:
              limits:
                cpu: "32"
                memory: "32Gi"
                nvidia.com/gpu: "4"
              requests:
                cpu: "8"
                memory: "16Gi"
                nvidia.com/gpu: "1"