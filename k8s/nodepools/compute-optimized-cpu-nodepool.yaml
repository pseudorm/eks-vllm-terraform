apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: "compute-optimized-amd64-ec2"
spec:
  template:
    metadata:
      labels:
        internal: "true"
        compute: "cpu"
        processor: "amd64"
        workload: "compute-optimized"
    spec:
      requirements:
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"]
      nodeClassRef:
        name: "compute-optimized-amd64-ec2"
        group: karpenter.k8s.aws
        kind: EC2NodeClass
      expireAfter: 720h
  limits:
    cpu: "50"
    memory: "512Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: "5m"

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: "compute-optimized-amd64-ec2"
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - id: ami-01e1150a3eee3c01b # bottlerocket-aws-k8s-1.36-x86_64-v1.62.0-49f1c7d2
  role: "karpenter-eks-node-group-83e133e6a39377feb0c17d6365"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-use1
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-use1
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  tags:
    nvidia.com/gpu: "false"
    auto-delete: "false"
    auto-stop: "false"

  blockDeviceMappings:
    # OS volume. Bottlerocket's own partitions (boot-a/b, root-a/b, etc.)
    # live here with a small fixed layout -- this size does NOT affect
    # container/ephemeral storage capacity, see:
    # https://github.com/aws/karpenter-provider-aws/issues/6214
    - deviceName: /dev/xvda
      ebs:
        volumeSize: "30Gi"
        volumeType: gp3
        deleteOnTermination: true
    # Data volume. This is what actually backs /var/lib/containerd,
    # kubelet ephemeral-storage, and container writable layers.
    - deviceName: /dev/xvdb
      ebs:
        volumeSize: "150Gi"
        volumeType: gp3
        deleteOnTermination: true
