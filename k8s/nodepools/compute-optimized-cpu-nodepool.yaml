apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: "compute-optimized-amd64-ec2"
spec:
  template:
    metadata:
      labels:
        internal: "true"
        compute: "cpu"
        processor: "amd64"
        workload: "compute-optimized"
    spec:
      requirements:
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - "c7i-flex.xlarge"
            - "c7i-flex.2xlarge"
        - key: "karpenter.sh/capacity-type"
          operator: In
          values:
            - "spot"
            - "on-demand"
      nodeClassRef:
        name: "compute-optimized-amd64-ec2"
        group: karpenter.k8s.aws
        kind: EC2NodeClass
      expireAfter: 720h
  limits:
    cpu: "50"
    memory: "512Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: "5m"

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: "compute-optimized-amd64-ec2"
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - id: ami-00a1b171294f24d1f
  role: "karpenter-eks-node-group-20260303082358806200000004"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-ape1
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-ape1
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  tags:
    nvidia.com/gpu: "false"
    "auto-delete": "false"
    "auto-stop": "false"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: "30Gi"
        volumeType: gp3
        deleteOnTermination: true
