apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: "cpu-general-purpose-amd64-ec2"
spec:
  template:
    metadata:
      labels:
        internal: "true"
        compute: "cpu"
        processor: "amd64"
        workload: "general-purpose"
    spec:
      requirements:
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - "t"
        - key: karpenter.k8s.aws/instance-family
          operator: Exists
        - key: karpenter.k8s.aws/instance-family
          operator: NotIn
          values: ["t4g"]
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small"]
        - key: karpenter.k8s.aws/instance-memory
          operator: Gt
          values: ["4096"] # at least 4Gi
        - key: node.kubernetes.io/instance-type
          operator: Exists
          minValues: 3
        - key: "karpenter.sh/capacity-type"
          operator: In
          values:
            - "spot"
            - "on-demand"
      nodeClassRef:
        name: "cpu-general-purpose-amd64-ec2"
        group: karpenter.k8s.aws
        kind: EC2NodeClass
      expireAfter: 720h
  limits:
    cpu: "50"
    memory: "512Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: "5m"

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: "cpu-general-purpose-amd64-ec2"
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - id: ami-01e1150a3eee3c01b # bottlerocket-aws-k8s-1.36-x86_64-v1.62.0-49f1c7d2
  role: "karpenter-eks-node-group-83e133e6a39377feb0c17d6365"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-use1
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-use1
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  tags:
    nvidia.com/gpu: "false"
    auto-delete: "false"
    auto-stop: "false"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: "30Gi"
        volumeType: gp3
        deleteOnTermination: true
