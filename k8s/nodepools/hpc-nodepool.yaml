apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: "cpu-hpc-amd64-ec2"
spec:
  template:
    metadata:
      labels:
        internal: "true"
        compute: "cpu"
        processor: "amd64"
        workload: "hpc"
    spec:
      requirements:
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - "c"
        - key: karpenter.k8s.aws/instance-memory
          operator: Gt
          values: ["8192"] # at least 8Gi
        - key: node.kubernetes.io/instance-type
          operator: Exists
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"]
      nodeClassRef:
        name: "cpu-hpc-amd64-ec2"
        group: karpenter.k8s.aws
        kind: EC2NodeClass
      expireAfter: 720h
  limits:
    cpu: "100"
    memory: "320Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: "5m"

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: "cpu-hpc-amd64-ec2"
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - id: ami-00a1b171294f24d1f
  role: "karpenter-eks-node-group-20260303082358806200000004"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-ape1
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-ape1
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  tags:
    nvidia.com/gpu: "false"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: "30Gi"
        volumeType: gp3
        deleteOnTermination: true
