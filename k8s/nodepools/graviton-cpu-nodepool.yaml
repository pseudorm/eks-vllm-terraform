apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: "cpu-burstable-graviton-ec2"
spec:
  template:
    metadata:
      labels:
        internal: "true"
        compute: "cpu"
        processor: "arm64"
        workload: "general-purpose"
    spec:
      requirements:
        - key: "kubernetes.io/arch"
          operator: In
          values: ["arm64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            # - "t4g.medium"
            # - "t4g.large"
            - "t4g.xlarge"
            - "t4g.2xlarge"
        # - key: karpenter.k8s.aws/instance-memory
        #   operator: Gt
        #   values: ["4096"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values:
            - "spot"
            - "on-demand"
      nodeClassRef:
        name: "cpu-burstable-graviton-ec2"
        group: karpenter.k8s.aws
        kind: EC2NodeClass
      expireAfter: 720h
  limits:
    # Karpenter counts whole node capacity here, not pod requests, so each
    # t4g.xlarge consumes 4. At cpu:10 the pool sat at 8 (2 nodes) and could
    # not fit a third, which blocked the sharded S3 deletion job entirely.
    # 26 leaves room for ~6 t4g.xlarge; lower it again once that job is done.
    cpu: "26"
    memory: "128Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: "5m"

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: "cpu-burstable-graviton-ec2"
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - alias: bottlerocket@latest
  role: "karpenter-eks-node-group-20260303082358806200000004"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-ape1
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-ape1
  tags:
    nvidia.com/gpu: "false"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: "30Gi"
        volumeType: gp3
        deleteOnTermination: true
