# ============================================================
# AI Platform - Unified Helm Chart Values
# ============================================================

nameOverride: ""
fullnameOverride: ""

# ============================================================
# Shared Ingress (single ALB with subpath routing)
# ============================================================
ingress:
  enabled: true
  scheme: internal
  securityGroup: sg-060cc981400089332
  tags: "Environment=dev,Project=eks-ai-ape1,auto-delete=false,auto-stop=no"
  annotations: {}
  tls: []

# ============================================================
# Open-WebUI - Chat Frontend
# ============================================================
openWebui:
  enabled: false
  replicaCount: 1

  image:
    repository: 169446447120.dkr.ecr.ap-east-1.amazonaws.com/docker-hub/dyrnq/open-webui
    tag: v0.3.25
    pullPolicy: Always

  containerPort: 8080

  service:
    type: ClusterIP
    port: 8080

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

  resources:
    limits:
      cpu: 2
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 64Mi

  nodeSelector:
    karpenter.sh/nodepool: cpu-burstable-graviton-ec2

  tolerations: []

  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: open-webui-db
          key: db_url
    - name: DATABASE_TYPE
      value: "postgresql"


# ============================================================
# MCP SearXNG - MCP Server for SearXNG
# ============================================================
mcpSearxng:
  enabled: true
  replicaCount: 1

  image:
    repository: supercorp/supergateway
    tag: latest
    pullPolicy: IfNotPresent

  containerPort: 3000
  searxngUrl: "" # defaults to http://searxng-http.<namespace>.svc.cluster.local:8080

  service:
    type: ClusterIP
    port: 3000

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  nodeSelector:
    compute: cpu
    internal: "true"
    processor: amd64
    workload: general-purpose

# ============================================================
# SearXNG - Search Engine (subchart)
# ============================================================
searxng:
  enabled: true
  env:
    - name: SEARXNG_BASE_URL
      value: "http://aip.chester.ai/searxng"
  nodeSelector:
    compute: cpu
    internal: "true"
    processor: amd64
    workload: general-purpose
