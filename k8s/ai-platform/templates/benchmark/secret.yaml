{{- if .Values.benchmark.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-platform.fullname" . }}-benchmark-secrets
  labels:
    {{- include "ai-platform.componentLabels" . | nindent 4 }}
    app.kubernetes.io/component: benchmark
type: Opaque
stringData:
  # A LiteLLM virtual key scoped to benchmark.target.servedModelName.
  # Set via values-secrets.yaml (gitignored), not values-benchmark.yaml.
  litellmApiKey: {{ .Values.benchmark.litellmApiKey | default "" | quote }}
{{- end }}
