{{- if .Values.mcpSearxng.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-platform.fullname" . }}-mcp-searxng
  labels:
    {{- include "ai-platform.componentLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-searxng
spec:
  replicas: {{ .Values.mcpSearxng.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-platform.mcpSearxng.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-platform.mcpSearxng.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: mcp-searxng
          image: "{{ .Values.mcpSearxng.image.repository }}:{{ .Values.mcpSearxng.image.tag }}"
          imagePullPolicy: {{ .Values.mcpSearxng.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              npm install -g mcp-searxng &&
              npx supergateway \
                --stdio "mcp-searxng" \
                --outputTransport streamableHttp \
                --port {{ .Values.mcpSearxng.containerPort }} \
                --healthEndpoint /health \
                --streamableHttpPath "/mcp-searxng/mcp" \
                --cors
          ports:
            - name: http
              containerPort: {{ .Values.mcpSearxng.containerPort }}
              protocol: TCP
          env:
            - name: SEARXNG_URL
              value: {{ .Values.mcpSearxng.searxngUrl | default (printf "http://searxng-http.%s.svc.cluster.local:8080" .Release.Namespace) }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcpSearxng.resources | nindent 12 }}
      {{- with .Values.mcpSearxng.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
