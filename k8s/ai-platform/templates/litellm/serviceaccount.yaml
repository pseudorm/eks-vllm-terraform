{{- if or (.Values.litellm.controlPlane.enabled) (.Values.litellm.dataPlane.enabled) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-platform.fullname" . }}-litellm
  labels:
    {{- include "ai-platform.componentLabels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
  {{- with .Values.litellm.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.litellm.serviceAccount.automount }}
{{- end }}
