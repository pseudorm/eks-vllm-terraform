{{- if .Values.vllm.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-platform.fullname" . }}-vllm-s3-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.vllm.persistentVolume.size }}
  volumeName: {{ include "ai-platform.fullname" . }}-vllm-s3-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "ai-platform.fullname" . }}-vllm-s3-pv
spec:
  capacity:
    storage: {{ .Values.vllm.persistentVolume.size }}
  accessModes:
    - ReadWriteMany
  mountOptions:
    - allow-delete
    - allow-other
    - uid=1000
    - gid=1000
    - region={{ .Values.vllm.persistentVolume.s3Bucket.region }}
    - --cache /mnt/raid0-cache # cache reads to local nvme instance store
  csi:
    driver: s3.csi.aws.com
    volumeHandle: s3-csi-driver-volume
    volumeAttributes:
      bucketName: {{ .Values.vllm.persistentVolume.s3Bucket.name }}
{{- end }}