{{- if .Values.vllm.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-platform.fullname" . }}-vllm-config
  labels:
    {{- include "ai-platform.componentLabels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
data:
  {{- with .Values.vllm.extraConfig }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  config.yaml: |
    {{- .Values.vllm.runtimeArgs | nindent 4 }}
{{- end }}
