{{- if and .Values.openWebui.enabled .Values.openWebui.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ai-platform.fullname" . }}-open-webui
  labels:
    {{- include "ai-platform.componentLabels" . | nindent 4 }}
    app.kubernetes.io/component: open-webui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ai-platform.fullname" . }}-open-webui
  minReplicas: {{ .Values.openWebui.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.openWebui.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.openWebui.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
