{{- if .Values.openWebui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-platform.fullname" . }}-open-webui
  labels:
    {{- include "ai-platform.componentLabels" . | nindent 4 }}
    app.kubernetes.io/component: open-webui
spec:
  {{- if not .Values.openWebui.autoscaling.enabled }}
  replicas: {{ .Values.openWebui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-platform.openWebui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-platform.openWebui.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: open-webui
          image: "{{ .Values.openWebui.image.repository }}:{{ .Values.openWebui.image.tag }}"
          imagePullPolicy: {{ .Values.openWebui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.openWebui.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.openWebui.containerPort | quote }}
            - name: ENABLE_OLLAMA_API
              value: "false"
            {{- range .Values.openWebui.env }}
            - name: {{ .name }}
              {{- if .value }}
              value: {{ .value | quote }}
              {{- end }}
              {{- if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.openWebui.resources | nindent 12 }}
      {{- with .Values.openWebui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.openWebui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
