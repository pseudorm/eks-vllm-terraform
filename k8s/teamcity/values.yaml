efs:
  fileSystemId: fs-01e30f335cf8d1fb2

teamcity-server:

  image:
    repository: jetbrains/teamcity-server
    tag: 2026.1.3
    pullPolicy: IfNotPresent
    imagePullSecrets: []

  proxy:
    replicas: 2 # HAProxy handles X-TeamCity-Node-Id-Cookie sticky routing across multi-node teamcity.nodes -- ALB/NLB alone can't do this
    ingress:
      ingressClassName: alb
      # Left empty on purpose: this block's catch-all path always routes to the
      # (disabled) teamcity-server-proxy service. teamcity.nodes[<index>].ingress.host
      # below covers every path via teamcity-server-direct-h<index> instead, which
      # points straight at the pod.
      hosts: []
      annotations: {}
        # kubernetes.io/ingress.class: alb
        # alb.ingress.kubernetes.io/scheme: internal
        # alb.ingress.kubernetes.io/target-type: ip
        # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
        # alb.ingress.kubernetes.io/backend-protocol: HTTP
        # alb.ingress.kubernetes.io/security-groups: sg-060cc981400089332
        # alb.ingress.kubernetes.io/tags: Environment=dev,Project=eks-ai-use1,auto-delete=false,auto-stop=no
        # alb.ingress.kubernetes.io/healthcheck-path: /healthCheck/healthy
        # alb.ingress.kubernetes.io/target-group-attributes: load_balancing.algorithm.type=least_outstanding_requests
    affinity: {}
    tolerations:
      - key: "{{ $.Release.Name }}-proxy"
        operator: Exists
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: "{{ $.Release.Name }}-proxy"
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: "{{ $.Release.Name }}-proxy"

  ## Teamcity deployed by StateFulSet
  ## @param teamcity.resources default value for all nodes in sts
  teamcity:
    resources:
      requests:
        cpu: 100m
        memory: 2048Mi
    ## @param teamcity.env default values for all nodes in sts
    env:
      TEAMCITY_SERVER_MEM_OPTS: -Xms512m -Xmx2048m
      POD_NAME:
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
    startupProbe: ~
    livenessProbe:
      httpGet:
        path: /healthCheck/healthy
        port: http
        scheme: HTTP
      failureThreshold: 3
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /healthCheck/ready
        port: http
        scheme: HTTP
      failureThreshold: 2
      periodSeconds: 10
    ports:
    - containerPort: 8111
      name: http
      protocol: TCP
    affinity: {}
    #   nodeAffinity:
    #     requiredDuringSchedulingIgnoredDuringExecution:
    #       nodeSelectorTerms:
    #         - matchExpressions:
    #             - key: karpenter.sh/nodepool
    #               operator: In
    #               values:
    #                 - cpu-general-purpose-amd64-ec2
    tolerations:
      - key: "{{ $.Release.Name }}"
        operator: Exists
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: "{{ $.Release.Name }}"
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: "{{ $.Release.Name }}"
    hostAliases: []
    ## @param teamcity.nodes[<index>] override per <index> of sts node
    nodes:
    ## @param teamcity.nodes[<index>].ingress.host passed to ingress/tls if not empty
    - ingress:
        host: teamcity.chester.ai
      responsibilities:
      - MAIN_NODE
      - CAN_PROCESS_BUILD_TRIGGERS
      - CAN_PROCESS_USER_DATA_MODIFICATION_REQUESTS
      - CAN_CHECK_FOR_CHANGES
      - CAN_PROCESS_BUILD_MESSAGES
    - responsibilities:
      - CAN_PROCESS_BUILD_TRIGGERS
      - CAN_PROCESS_USER_DATA_MODIFICATION_REQUESTS
      - CAN_CHECK_FOR_CHANGES
      - CAN_PROCESS_BUILD_MESSAGES

  serviceAccount:
    enabled: true
    annotations: {}
    agentRBAC:
      enabled: true

  pdb:
    enabled: true
    minAvailable: 1

  pvc:
    name: teamcity-server-data
    annotations:
      helm.sh/resource-policy: keep
    storageClassName: efs
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        storage: 16Gi

  ## Create & Mount PVC for /opt/teamcity directories
  ## Defaults to emptyDir
  ## Generated by STS PVC Template - volume per node
  ephemeral:
    temp:
      enabled: false
      storageClassName: efs
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 16Gi
    logs:
      enabled: false
      storageClassName: efs
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 16Gi
    # cache:
    #   enabled: false
    #   storageClassName: efs
    #   accessModes:
    #     - ReadWriteOnce
    #   resources:
    #     requests:
    #       storage: 16Gi

  database:
    host: "teamcity-aurora-dev.cluster-ckvs422oyh0t.us-east-1.rds.amazonaws.com"
    name: "teamcity"
    user: "teamcity_admin"
    password: 'V_.KI?r_3>e]d4AwJGlZMLrBO5vT'

  configMap:
    datadirConfig:
      internal.properties: |
        teamcity.internal.aws.connection.defaultCredentialsProviderEnabled=true
        teamcity.kubernetes.localServiceAccount.enable=true
      database.properties: |
        connectionUrl=jdbc:postgresql://{{ $.Values.database.host }}/{{ .Values.database.name}}
        connectionProperties.user={{ $.Values.database.user }}
        connectionProperties.password={{ $.Values.database.password }}
        maxConnections=50
    optConf: ~
      # server.xml: |-
    services:
      fastunzip.sh: |
        #!/bin/bash
        cd /opt/teamcity/webapps/ROOT/WEB-INF/plugins
        for zip in ./*.zip; do
          test -f $zip || continue
          unzip $zip -d $(basename $zip .zip) > /dev/null && rm -f $zip &
        done
        wait
