      #   mkdir -p "$TEAMCITY_DATA_PATH/nodes/$HOSTNAME/system/"
      #   if [ -d $TEAMCITY_DATA_PATH/nodes/$HOSTNAME/system/caches ]; then
      #     mv -v $TEAMCITY_DATA_PATH/nodes/$HOSTNAME/system/caches $TEAMCITY_DATA_PATH/nodes/$HOSTNAME/system/caches.old
      #   fi
      #   ln -svr "$TEAMCITY_DIST/cache/" "$TEAMCITY_DATA_PATH/nodes/$HOSTNAME/system/caches"
