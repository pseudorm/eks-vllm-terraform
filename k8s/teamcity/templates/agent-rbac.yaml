apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teamcity-agent
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teamcity-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teamcity-agent
subjects:
  - kind: ServiceAccount
    name: teamcity-agent
